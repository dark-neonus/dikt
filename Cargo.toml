[package]
name = "dikt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Decisions, ideas, knowledge and tasks as validated local Markdown, for people and AI agents"
readme = "README.md"
include = ["src/**", "templates/**", "tests/**", "Cargo.toml", "Cargo.lock", "pyproject.toml", "README.md"]

[[bin]]
name = "dikt"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive", "env"] }
indexmap = "2.14.2"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_norway = "0.9.42"
tempfile = "3.27.0"
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
